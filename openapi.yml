openapi: 3.0.3
info:
  title: Task Management System
  description: A simple API to manage tasks with JWT-based authentication and task categories.
  version: 1.0.0
servers:
  - url: https://localhost:8080

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    UserRole:
      type: string
      enum: [user, admin]
      example: "user"

    TaskStatus:
      type: string
      enum: [pending, in_progress, completed, expired]
      example: "pending"

    TaskPriority:
      type: string
      enum: [low, normal, urgent]
      example: "normal"

    TaskCommonFields:
      type: object
      properties:
        title:
          type: string
          example: "Implement user authentication"
        description:
          type: string
          example: "Develop and test JWT-based authentication"
        category:
          type: string
          default: "new"
          example: "work"
        deadline:
          type: string
          format: date-time
          example: "2024-09-30T23:59:59"

    TaskBase:
      allOf:
        - $ref: '#/components/schemas/TaskCommonFields'
        - type: object
          properties:
            priority:
              $ref: '#/components/schemas/TaskPriority'
            status:
              $ref: '#/components/schemas/TaskStatus'

    Task:
      allOf:
        - $ref: '#/components/schemas/TaskBase'
        - type: object
          properties:
            task_id:
              type: integer
              example: 101
            user_id:
              type: integer
              example: 3
            created_at:
              type: string
              format: date-time
              example: "2024-09-25T12:00:00"
            updated_at:
              type: string
              format: date-time
              example: "2024-09-26T10:00:00"

    TaskCreate:
      allOf:
        - $ref: '#/components/schemas/TaskBase'
      required:
        - title
        - priority
        - status

    TaskCreate2:
      allOf:
        - $ref: '#/components/schemas/TaskCreate'
        - type: object
          properties:
            user_id:
              type: integer
              example: 3

    TaskUpdate:
      allOf:
        - $ref: '#/components/schemas/TaskBase'

    TaskUpdate2:
      allOf:
        - $ref: '#/components/schemas/TaskBase'
        - type: object
          properties:
            user_id:
              type: integer
              example: 3

    UserCommon:
      type: object
      properties:
        name:
          type: string
          example: "John"
        last_name:
          type: string
          example: "Doe"
        email:
          type: string
          format: email
          example: "john.doe@example.com"
        login:
          type: string
          example: "john_doe"
        role:
          $ref: '#/components/schemas/UserRole'

    UserBase:
      allOf:
        - $ref: '#/components/schemas/UserCommon'
        - type: object
          properties:
            password:
              type: string
              example: "abrew1"

    UserNoPassword:
      allOf:
        - $ref: '#/components/schemas/UserCommon'
        - type: object
          properties:
            user_id:
              type: integer
              example: 1
            created_at:
              type: string
              format: date-time
              example: "2024-09-25T12:00:00"
            updated_at:
              type: string
              format: date-time
              example: "2024-09-26T10:00:00"

    User:
      allOf:
        - $ref: '#/components/schemas/UserNoPassword'
        - type: object
          properties:
            password:
              type: string
              example: "abrew1"

    UserCreate:
      type: object
      properties:
        name:
          type: string
          example: "John"
        last_name:
          type: string
          example: "Doe"
        email:
          type: string
          format: email
          example: "john.doe@example.com"
        login:
          type: string
          example: "john_doe"        
        password:
          type: string
          example: "abrew1"

    UserCreate2:
      allOf:
        - $ref: '#/components/schemas/UserCreate'
        - type: object
          properties:
            role:
              $ref: '#/components/schemas/UserRole'

    UserUpdate:
      allOf:
        - $ref: '#/components/schemas/UserBase'
    
    CommonError:
      type: object
      properties:
        code:
          type: string
          description: Error code.
          example: "validation_error"
        message:
          type: string
          description: A human-readable error message.
          example: "Invalid input data"
        details:
          type: object
          description: Additional context or details about the error.
          example: {"field": "email", "reason": "must be a valid email address"}
      required:
        - code
        - message

  responses:
    UnauthorizedError:
      description: Access token is missing or invalid

    BadInputError:
      description: Invalid input or missing required fields

    DublicateEmailOrLoginError:
      description: Dublicate email or login

    TaskNotFoundError:
      description: Task not found

    UserNotFoundError:
      description: User not found

    ForbiddenAccessError:
      description: Not enough permissions

    InternalServerError:
      description: Internal server error

  parameters:
    UserIdArrayFilter:
      name: user_ids
      in: query
      description: IDs of users to filter tasks by
      required: false
      schema:
        type: array
        items:
          type: integer
      example: [3, 4]
    StatusArrayFilter:
      name: statuses
      in: query
      description: Filter tasks by one or more statuses
      required: false
      schema:
        type: array
        items:
          $ref: '#/components/schemas/TaskStatus'
      style: form
      explode: false
      example: ["pending", "in_progress"]
    PriorityArrayFilter:
      name: priorities
      in: query
      description: Filter tasks by one or more priorities
      required: false
      schema:
        type: array
        items:
          $ref: '#/components/schemas/TaskPriority'
      style: form
      explode: false
      example: ["low", "normal"]
    CategoryArrayFilter:
      name: categories
      in: query
      description: Filter tasks by one or more categories
      required: false
      schema:
        type: array
        items:
          type: string
      example: ["work", "home"]
    DeadlineStartFilter:
      name: deadline_start
      in: query
      description: Filter tasks with deadlines on or after this date ("2025-01-23T11:58:17Z")
      required: false
      schema:
        type: string
        format: date
    DeadlineEndFilter:
      name: deadline_end
      in: query
      description: Filter tasks with deadlines on or before this date ("2025-01-23T11:58:17Z")
      required: false
      schema:
        type: string
        format: date
    PageParameter:
      name: page
      in: query
      description: Page number for pagination
      required: false
      schema:
        type: integer
        default: 1
      example: 1
    LimitParameter:
      name: limit
      in: query
      description: Number of items per page
      required: false
      schema:
        type: integer
        default: 10
      example: 10

tags:
  - name: Admin
  - name: User

paths:

  /v1/auth/register:
    post:
      summary: User registration
      tags:
        - User
      description: Registers a new user and returns the created user information along with an authentication token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        201:
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: Authentication token for the newly registered user
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  user:
                    $ref: '#/components/schemas/UserNoPassword'
        400:
          $ref: '#/components/responses/BadInputError'
        404:
          $ref: '#/components/responses/DublicateEmailOrLoginError'
        500:
          $ref: '#/components/responses/InternalServerError'

  /v1/auth/login:
    post:
      summary: User login
      tags:
        - User
      description: Logs in a user and returns a JWT token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - login
                - password
              properties:
                login:
                  type: string
                  example: "john_doe"
                password:
                  type: string
                  format: password
                  example: "strong_password"
      responses:
        200:
          description: JWT token returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: "jwt_token_string"
        401:
          description: Invalid credentials

  /v1/tasks:
    get:
      summary: Get a list of tasks
      tags:
        - User
      description: Retrieve all tasks, optionally filtering by status, priority, category, or deadline.
      parameters:
        - $ref: '#/components/parameters/StatusArrayFilter'
        - $ref: '#/components/parameters/PriorityArrayFilter'
        - $ref: '#/components/parameters/CategoryArrayFilter'
        - $ref: '#/components/parameters/DeadlineStartFilter'
        - $ref: '#/components/parameters/DeadlineEndFilter'
        - $ref: '#/components/parameters/PageParameter'
        - $ref: '#/components/parameters/LimitParameter'
      security:
        - BearerAuth: []
      responses:
        200:
          description: A list of tasks
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
                  total:
                    type: integer
                    description: Total number of tasks
                    example: 10
                  page:
                    type: integer
                    description: Current page number
                    example: 1
                  limit:
                    type: integer
                    description: Number of tasks per page
                    example: 10
        401:
          $ref: '#/components/responses/UnauthorizedError'
        500:
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Create a new task
      tags:
        - User
      description: Add a new task to the system.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
      security:
        - BearerAuth: []
      responses:
        201:
          description: Task created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        400:
          $ref: '#/components/responses/BadInputError'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        500:
          $ref: '#/components/responses/InternalServerError'

  /v1/admin/tasks:
    post:
      summary: Create a new task
      tags:
        - Admin
      description: Add a new task to the system for any user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate2'
      security:
        - BearerAuth: []
      responses:
        201:
          description: Task created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        400:
          $ref: '#/components/responses/BadInputError'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        500:
          $ref: '#/components/responses/InternalServerError'

    get:
      summary: Get all tasks with optional filtering and pagination.
      tags:
        - Admin
      description: Retrieve tasks that satisfy filtering and pagination options.
      parameters:
        - $ref: '#/components/parameters/UserIdArrayFilter'
        - $ref: '#/components/parameters/StatusArrayFilter'
        - $ref: '#/components/parameters/PriorityArrayFilter'
        - $ref: '#/components/parameters/CategoryArrayFilter'
        - $ref: '#/components/parameters/DeadlineStartFilter'
        - $ref: '#/components/parameters/DeadlineEndFilter'
        - $ref: '#/components/parameters/PageParameter'
        - $ref: '#/components/parameters/LimitParameter'
      security:
        - BearerAuth: []
      responses:
        200:
          description: A list of tasks for the specified user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        404:
          $ref: '#/components/responses/UserNotFoundError'
        500:
          $ref: '#/components/responses/InternalServerError'

  /v1/tasks/{task_id}:
    get:
      summary: Get task by ID
      tags:
        - User
      description: Retrieve a specific task by its ID.
      parameters:
        - name: task_id
          in: path
          required: true
          description: ID of the task to retrieve
          schema:
            type: integer
      security:
        - BearerAuth: []
      responses:
        200:
          description: A single task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        404:
          $ref: '#/components/responses/TaskNotFoundError'
        500:
          $ref: '#/components/responses/InternalServerError'
    put:
      summary: Update task by ID
      tags:
        - User
      description: Update the details of a specific task.
      parameters:
        - name: task_id
          in: path
          required: true
          description: ID of the task to update
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdate'
      security:
        - BearerAuth: []
      responses:
        200:
          description: Task updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        400:
          $ref: '#/components/responses/BadInputError'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        404:
          $ref: '#/components/responses/TaskNotFoundError'
        500:
          $ref: '#/components/responses/InternalServerError'
    delete:
      summary: Delete task by ID
      tags:
        - User
      description: Remove a specific task from the system.
      parameters:
        - name: task_id
          in: path
          required: true
          description: ID of the task to delete
          schema:
            type: integer
      security:
        - BearerAuth: []
      responses:
        204:
          description: Task deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        404:
          $ref: '#/components/responses/TaskNotFoundError'
        500:
          $ref: '#/components/responses/InternalServerError'

  /v1/admin/users:
    post:
      summary: Create a new user
      tags:
        - Admin
      description: Admin-only. Creates a new user in the system and returns the created user information along with an authentication token.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate2'
      responses:
        201:
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: Authentication token for the newly created user
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  user:
                    $ref: '#/components/schemas/UserNoPassword'
        400:
          $ref: '#/components/responses/BadInputError'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        403:
          $ref: '#/components/responses/ForbiddenAccessError'
        500:
          $ref: '#/components/responses/InternalServerError'      

  /v1/admin/users/{user_id}:
    get:
      summary: Get info about the user.
      tags:
        - Admin
      description: Admin-only. Get info about the user with the specified id without password.
      parameters:
        - name: user_id
          in: path
          required: true
          description: ID of the user to update
          schema:
            type: integer
      security:
        - BearerAuth: []
      responses:
        200:
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserNoPassword'
        400:
          $ref: '#/components/responses/BadInputError'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        403:
          $ref: '#/components/responses/ForbiddenAccessError'
        500:
          $ref: '#/components/responses/InternalServerError'

    put:
      summary: Update user data by ID
      tags:
        - Admin
      description: Allows an admin to update a specific user's information.
      parameters:
        - name: user_id
          in: path
          required: true
          description: ID of the user to update
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      security:
        - BearerAuth: []
      responses:
        200:
          description: User updated successfully
        400:
          description: Invalid input or missing required fields
        401:
          $ref: '#/components/responses/UnauthorizedError'
        404:
          description: User not found
        500:
          description: Internal server error

    delete:
      summary: Delete a user
      tags:
        - Admin
      description: Admin-only. Deletes a user by their ID.
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            example: "123"
          description: The ID of the user to delete
      security:
        - BearerAuth: []
      responses:
        204:
          description: User deleted successfully
        401:
          $ref: '#/components/responses/UnauthorizedError'
        403:
          $ref: '#/components/responses/ForbiddenAccessError'
        404:
          $ref: '#/components/responses/UserNotFoundError'
        500:
          $ref: '#/components/responses/InternalServerError'

  /v1/admin/tasks/{task_id}:
    put:
      summary: Update a task
      tags:
        - Admin
      description: Admin-only. Update any task by its ID.
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: integer
            example: "101"
          description: The ID of the task to update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdate2'
      security:
        - BearerAuth: []
      responses:
        200:
          description: Task updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        400:
          $ref: '#/components/responses/BadInputError'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        403:
          $ref: '#/components/responses/ForbiddenAccessError'
        404:
          $ref: '#/components/responses/TaskNotFoundError'
        500:
          $ref: '#/components/responses/InternalServerError'

    get:
      summary: Get task by ID
      tags:
        - Admin
      description: Retrieve a specific task by its ID.
      parameters:
        - name: task_id
          in: path
          required: true
          description: ID of the task to retrieve
          schema:
            type: integer
      security:
        - BearerAuth: []
      responses:
        200:
          description: A single task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        403:
          $ref: '#/components/responses/ForbiddenAccessError'
        404:
          $ref: '#/components/responses/TaskNotFoundError'
        500:
          $ref: '#/components/responses/InternalServerError'

    delete:
      summary: Delete a task
      tags:
        - Admin
      description: Admin-only. Deletes any task by its ID.
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: integer
            example: "101"
          description: The ID of the task to delete
      security:
        - BearerAuth: []
      responses:
        204:
          description: Task deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        403:
          $ref: '#/components/responses/ForbiddenAccessError'
        404:
          $ref: '#/components/responses/TaskNotFoundError'
        500:
          $ref: '#/components/responses/InternalServerError'
